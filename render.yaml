services:
  - type: web
    name: persona-churn-lab
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEMO_MODE
        value: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SESSION_SECRET
        generateValue: true
